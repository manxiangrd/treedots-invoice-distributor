name: Daily Invoice Distribution

on:
  schedule:
    # Runs every day at 8 PM (20:00) UTC
    # For Singapore (UTC+8), 8 PM SGT = 12 PM UTC, use: 0 12 * * *
    - cron: '0 20 * * *'
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  send-invoices:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Build Docker image
        run: docker build -t invoice-distributor .
      
      - name: Run invoice distribution script
        env:
          PORTAL_USERNAME: ${{ secrets.PORTAL_USERNAME }}
          PORTAL_PASSWORD: ${{ secrets.PORTAL_PASSWORD }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          MAYTAPI_API_KEY: ${{ secrets.MAYTAPI_API_KEY }}
          MAYTAPI_PRODUCT_ID: ${{ secrets.MAYTAPI_PRODUCT_ID }}
          MAYTAPI_PHONE_ID: ${{ secrets.MAYTAPI_PHONE_ID }}
        run: docker run --env PORTAL_USERNAME --env PORTAL_PASSWORD --env GOOGLE_SHEET_ID --env GOOGLE_API_KEY --env MAYTAPI_API_KEY --env MAYTAPI_PRODUCT_ID --env MAYTAPI_PHONE_ID invoice-distributor
      
      - name: Notify on failure
        if: failure()
        run: echo "Invoice distribution failed - check logs for details"
